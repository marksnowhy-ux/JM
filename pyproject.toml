[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "math-modeling-f-question"
version = "JM"
description = "算力约束下提升大语言模型能力的资源配置建模（数学建模 F 题）— 四问管线、基准套件与单文档报告"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "joblib",
    "statsmodels",
    "openpyxl",
    "python-docx",
]

[project.scripts]
f-model = "f_model.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
